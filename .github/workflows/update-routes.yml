name: Auto Update Keenetic Routes (14 Days)

on:
  schedule:
    # Run every 14 days at 00:00 UTC
    - cron: '0 0 */14 * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-routes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Route Update Pipeline
        run: python update_routes.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No changes in route data to commit."
          else
            git commit -m "auto: update route lists and metadata [cron 14d]"
            git push
          fi
