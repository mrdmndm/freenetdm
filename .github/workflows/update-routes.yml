name: Auto Update Keenetic Routes (14 Days)

on:
  schedule:
    - cron: '0 0 */14 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-routes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run route update script
        run: python update_routes.py

      - name: Commit and push updated routes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/data/
          if git diff --staged --quiet; then
            echo "No changes in route data to commit."
          else
            git commit -m "auto: update route lists and metadata [cron 14d]"
            git push origin main
          fi
